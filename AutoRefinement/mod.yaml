title: "Auto Refinement"
description: "Buildings that normally need a Duplicant standing at them run by themselves.\n\nUses the game's own switch: ComplexFabricator already supports operating without a Duplicant, which is how the vanilla Kiln, Rubber Maker and Uranium Centrifuge work. This extends that to the Metal Refinery, Rock Crusher, Glass Forge, Supermaterial Refinery, cooking stations, apothecaries and the rest -- including buildings added by other mods.\n\nBy default a Duplicant can still come and help: the errand stays, so the building runs at normal speed on its own and half again as fast with someone working it, Machinery skill included. Both rates are configurable, or turn the errand off entirely for silent automation.\n\nThe Desalinator empties its own salt onto the floor instead of queueing an errand, so an Auto-Sweeper can collect it.\n\nEverything is grouped into categories in Mod Options -- refinement, cooking, medicine, clothing, crafting, research -- so you can automate some and leave others manual. Individual buildings can be excluded by ID in AutoRefinement.json.\n\nNo other mods required. Existing colonies work; nothing is written to your save."
staticID: "AutoRefinement"
