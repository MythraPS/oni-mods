title: "Critter Turret"
description: "A red robo-miner reconfigured to shoot critters instead of mining rock.\n\nMounts on floor, wall or ceiling and fires the duplicant multitool's attack laser within a directional arc (line-of-sight required), culling surplus critters once a species' population in its room passes a threshold you set.\n\nEach species is counted separately against its own threshold, with babies listed as their own rows, so one overcrowded species is thinned without touching the rest. Targets are picked from a species checklist. Sends a green Automation signal once every selected species is at or below the threshold.\n\nWorks submerged. Not industrial machinery, so it won't disqualify a room.\n\nStandalone — no other mods required. For the non-lethal version, see Critter Wrangler."
staticID: "CritterTurret"
