title: "Critter Wrangler"
description: "A teal robo-miner fitted with a Rancher's net gun.\n\nMounts on floor, wall or ceiling and automatically wrangles surplus critters within its room, at range and through line of sight, leaving them bagged for a Duplicant to carry to a Critter Drop-Off. No Ranching skill is consumed — the Wrangler does the catching itself.\n\nEach species is counted separately against its own population threshold, with babies listed as their own rows, so one overcrowded species is thinned without touching the rest. Targets are picked from a species checklist. Sends a green Automation signal once every selected species is at or below the threshold.\n\nWorks submerged. Not industrial machinery, so it won't disqualify a room.\n\nStandalone — no other mods required. Pairs with Critter Turret if you want the lethal version too."
staticID: "CritterWrangler"
